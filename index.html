<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mastergram</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0a0e13" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Mastergram" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<style>
  :root {
    --bg:#070a10; --bg-1:#0a0f17; --bg-2:#0c121b;
    --card: rgba(255,255,255,0.045);
    --card-hi: rgba(255,255,255,0.07);
    --surface-2: rgba(255,255,255,0.06);
    --line: rgba(255,255,255,0.09);
    --line-strong: rgba(255,255,255,0.16);
    --text:#f3f6fa; --muted:#9aa7b6; --soft:#63707e;
    --grow:#3ddc8a; --grow-deep:#1f7a4c;
    --blue:#5ab0f5; --gold:#f2c14e; --behind:#f2724c;
    --radius:20px; --radius-sm:14px;
    --shadow:0 10px 30px rgba(0,0,0,.38), 0 2px 8px rgba(0,0,0,.22);
    --inner-hi:inset 0 1px 0 rgba(255,255,255,.06);
    --glass:saturate(140%) blur(14px);
  }

  body.light {
    --bg:#f4f6f8; --bg-1:#ffffff; --bg-2:#eef1f5;
    --card: rgba(255,255,255,0.86);
    --card-hi: rgba(255,255,255,0.98);
    --surface-2: rgba(10,15,22,0.05);
    --line: rgba(10,15,22,0.10);
    --line-strong: rgba(10,15,22,0.20);
    --text:#111820; --muted:#5b6774; --soft:#8b96a3;
    --grow:#1f9e5f; --grow-deep:#14713f;
    --blue:#2b7fc9; --gold:#c08a12; --behind:#d1502a;
    --shadow:0 8px 24px rgba(16,24,40,.10), 0 1px 4px rgba(16,24,40,.06);
    --inner-hi:inset 0 1px 0 rgba(255,255,255,.7);
  }
  body.light::before {
    background:
      radial-gradient(130% 80% at 15% -5%, rgba(31,158,95,.10), transparent 55%),
      radial-gradient(120% 75% at 95% 105%, rgba(43,127,201,.09), transparent 55%),
      linear-gradient(180deg, #ffffff 0%, #eef1f5 100%);
  }
  body.light .tab.active { background:#111820; color:#fff; }
  body.light .log-btn, body.light .save-btn, body.light .toast, body.light .upd-go { color:#03200f; }
  body.light .ring-track { stroke:rgba(10,15,22,.08); }
  body.light .hero::after { background:radial-gradient(circle, rgba(31,158,95,.12), transparent 70%); }
  body.light .sheet { background:linear-gradient(180deg,#ffffff,#f4f6f8); }
  body.light .g-code { background:rgba(31,158,95,.08); border-color:rgba(31,158,95,.35); }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { background:var(--bg); color:var(--text); font-family:'Inter',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  body { position:relative; max-width:480px; margin:0 auto; padding:calc(22px + env(safe-area-inset-top)) 18px calc(56px + env(safe-area-inset-bottom)); min-height:100vh; }
  body::before { content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
    background:
      radial-gradient(130% 80% at 15% -5%, rgba(61,220,138,.12), transparent 55%),
      radial-gradient(120% 75% at 95% 105%, rgba(90,176,245,.10), transparent 55%),
      radial-gradient(90% 60% at 50% 50%, rgba(242,193,78,.03), transparent 70%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg) 100%); }
  .num { font-family:'Space Grotesk',sans-serif; font-feature-settings:"tnum" 1; font-variant-numeric:tabular-nums; }

  button:focus-visible, input:focus-visible, [data-tab]:focus-visible, [tabindex]:focus-visible {
    outline:2px solid var(--grow); outline-offset:3px; border-radius:12px; }

  header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:18px; }
  .goal-name { font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:600; line-height:1.12; letter-spacing:-0.02em; }
  .goal-sub { color:var(--muted); font-size:12.5px; margin-top:4px; letter-spacing:.01em; }
  .gear { flex:none; width:42px; height:42px; border-radius:13px; background:var(--card); border:1px solid var(--line); color:var(--muted);
    display:grid; place-items:center; cursor:pointer; -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass); box-shadow:var(--inner-hi); transition:color .15s, border-color .15s, transform .1s; }
  .gear:hover { color:var(--text); border-color:var(--line-strong); }
  .gear:active { transform:scale(.94); }
  .gear svg { width:20px; height:20px; }

  .tabs { display:flex; gap:8px; overflow-x:auto; margin-bottom:24px; padding-bottom:4px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:none; border:1px solid var(--line); background:var(--card); color:var(--muted); font-family:'Inter',sans-serif; font-size:13.5px; font-weight:500;
    padding:9px 16px; border-radius:99px; cursor:pointer; white-space:nowrap; -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass); box-shadow:var(--inner-hi); transition:color .15s, border-color .15s, background .15s, transform .1s; }
  .tab:active { transform:scale(.96); }
  .tab.active { background:rgba(255,255,255,.93); color:#0a0f16; border-color:transparent; font-weight:600; box-shadow:0 6px 18px rgba(0,0,0,.35); }
  .tab.add { color:var(--grow); }


  .tabs-wrap { position:relative; margin-bottom:24px; }
  .tabs { display:flex; gap:8px; overflow-x:auto; padding:0 34px 4px 0; -webkit-overflow-scrolling:touch; scrollbar-width:none; margin-bottom:0; scroll-behavior:smooth; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:none; white-space:nowrap; }
  .tabs-arrow { position:absolute; right:0; top:0; height:38px; width:34px; border:none; cursor:pointer; display:grid; place-items:center; color:var(--text);
    background:linear-gradient(90deg, transparent, var(--bg) 42%); }
  .tabs-arrow svg { width:20px; height:20px; }
  .tabs-arrow.hide { display:none; }
  .hero { display:grid; place-items:center; margin:10px 0 4px; position:relative; }
  .hero::after { content:""; position:absolute; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle, rgba(61,220,138,.16), transparent 70%); filter:blur(20px); z-index:0; pointer-events:none; }
  .ring-wrap { position:relative; width:250px; height:250px; z-index:1; }
  .ring-wrap svg { transform:rotate(-90deg); display:block; }
  .ring-track { stroke:rgba(255,255,255,.06); }
  .ring-fill { transition:stroke-dashoffset .8s cubic-bezier(.22,1,.36,1); }
  .ring-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .pct { font-family:'Space Grotesk',sans-serif; font-size:clamp(52px,17vw,62px); font-weight:700; line-height:1; letter-spacing:-0.03em; }
  .pct small { font-size:26px; font-weight:600; color:var(--muted); letter-spacing:0; }
  .pct-label { color:var(--muted); font-size:13px; margin-top:9px; letter-spacing:.02em; }
  .per-session { color:var(--soft); font-size:11.5px; margin-top:3px; }

  .pace { margin:26px 2px 6px; }
  .pace-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:11px; }
  .pace-label { font-size:12.5px; color:var(--muted); letter-spacing:.02em; }
  .pace-status { font-size:12.5px; font-weight:600; }
  .pace-bar { position:relative; height:10px; background:rgba(255,255,255,.06); border-radius:99px; margin-bottom:24px; box-shadow:inset 0 1px 2px rgba(0,0,0,.3); }
  .pace-fill { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg, var(--grow-deep), var(--grow)); border-radius:99px; transition:width .8s cubic-bezier(.22,1,.36,1), background .4s; box-shadow:0 0 12px rgba(61,220,138,.35); }
  .pace-marker { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--text); border-radius:2px; transition:left .8s cubic-bezier(.22,1,.36,1); box-shadow:0 0 6px rgba(255,255,255,.4); }
  .pace-marker::after { content:"attendu"; position:absolute; bottom:-17px; left:50%; transform:translateX(-50%); font-size:9.5px; color:var(--muted); white-space:nowrap; letter-spacing:.02em; }

  .action { margin:20px 0 6px; }
  .log-btn { position:relative; width:100%; border:1px solid rgba(255,255,255,.18); background:linear-gradient(180deg, #45e494, #2fb673); color:#052414;
    font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:600; padding:18px; border-radius:16px; cursor:pointer; overflow:hidden;
    box-shadow:0 10px 28px rgba(61,220,138,.30), var(--inner-hi); transition:transform .09s, filter .15s, box-shadow .2s; }
  .log-btn::before { content:""; position:absolute; inset:0 0 50% 0; background:linear-gradient(180deg, rgba(255,255,255,.28), transparent); pointer-events:none; }
  .log-btn:hover { filter:brightness(1.05); box-shadow:0 14px 34px rgba(61,220,138,.38), var(--inner-hi); }
  .log-btn:active { transform:scale(.98); }
  .today-row { display:flex; align-items:center; justify-content:space-between; margin-top:14px; font-size:13px; }
  .today-count { color:var(--muted); } .today-count b { color:var(--text); }
  .undo { background:none; border:none; color:var(--soft); font-size:13px; cursor:pointer; padding:6px; border-radius:8px; transition:color .15s; }
  .undo:hover { color:var(--behind); } .undo:disabled { opacity:.35; cursor:default; }

  .subgoal, .stat, .chart-card, .sess, .an-summary .stat { background:linear-gradient(180deg, var(--card-hi), var(--card)); border:1px solid var(--line);
    -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass); box-shadow:var(--shadow), var(--inner-hi); }
  .subgoal { margin-top:26px; border-radius:var(--radius); padding:17px 18px; }
  .subgoal-top { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; }
  .subgoal-title { font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:600; letter-spacing:-.01em; }
  .subgoal-count { font-family:'Space Grotesk',sans-serif; font-size:15px; color:var(--muted); } .subgoal-count b { color:var(--grow); font-size:17px; } .subgoal-count.done b { color:var(--gold); }
  .mini-bar { height:9px; background:rgba(255,255,255,.06); border-radius:99px; overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,.3); }
  .mini-fill { height:100%; background:linear-gradient(90deg, var(--grow-deep), var(--grow)); border-radius:99px; transition:width .7s cubic-bezier(.22,1,.36,1), background .4s; }
  .subgoal-foot { display:flex; align-items:center; justify-content:space-between; margin-top:12px; font-size:12.5px; color:var(--muted); }
  .streak { color:var(--gold); font-weight:600; }
  .wk-ctrl { display:inline-flex; align-items:center; gap:11px; }
  .wk-step { width:28px; height:28px; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--text); font-family:'Space Grotesk',sans-serif; font-size:17px; line-height:1; cursor:pointer; -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass); display:grid; place-items:center; transition:transform .1s, border-color .15s; box-shadow:var(--inner-hi); }
  .wk-step:hover { border-color:var(--line-strong); }
  .wk-step:active { transform:scale(.9); }

  .avg { margin-top:11px; border-radius:var(--radius); padding:16px 18px 15px; }
  .avg-top { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; }
  .avg-title { font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:600; letter-spacing:-.01em; }
  .avg-val { font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; letter-spacing:-.02em; }
  .avg-val span { font-size:13px; color:var(--muted); font-weight:500; }
  .avg-gauge { position:relative; height:12px; background:rgba(255,255,255,.06); border-radius:99px; margin:14px 0 8px; box-shadow:inset 0 1px 2px rgba(0,0,0,.3); }
  .avg-fill { position:absolute; left:0; top:0; bottom:0; border-radius:99px; transition:width .8s cubic-bezier(.22,1,.36,1), background .4s; }
  .avg-target { position:absolute; top:-5px; bottom:-5px; width:2.5px; background:var(--text); border-radius:2px; box-shadow:0 0 8px rgba(255,255,255,.5); }
  .avg-target::after { content:"4,5 visé"; position:absolute; bottom:-18px; left:50%; transform:translateX(-50%); font-size:9.5px; color:var(--muted); white-space:nowrap; }
  .avg-msg { font-size:12.5px; line-height:1.45; margin-top:22px; }
  .avg-msg b { font-weight:600; }

  .stats { display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-top:11px; }
  .stat { border-radius:var(--radius); padding:16px 17px; }
  .stat-v { font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:600; letter-spacing:-.02em; }
  .stat-l { color:var(--muted); font-size:12px; margin-top:5px; letter-spacing:.01em; }

  .analytics { margin-top:32px; }
  .an-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .an-head h2, .cal h2, .hist h2 { font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  .toggle { display:inline-flex; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:12px; padding:3px; -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass); }
  .toggle button { border:none; background:none; color:var(--muted); font-family:'Inter',sans-serif; font-size:13px; font-weight:500; padding:7px 15px; border-radius:9px; cursor:pointer; transition:color .15s, background .15s; }
  .toggle button.active { background:rgba(255,255,255,.1); color:var(--text); box-shadow:var(--inner-hi); }
  .chart-card { border-radius:var(--radius); padding:18px 15px 11px; }
  .chart-card svg { width:100%; height:auto; display:block; }
  .chart-legend { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); margin:12px 4px 2px; }
  .chart-legend .dash { width:16px; height:0; border-top:1.5px dashed var(--soft); }
  .an-summary { display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; margin-top:12px; }
  .an-summary .stat { padding:13px 10px; text-align:center; border-radius:var(--radius-sm); }
  .an-summary .stat-v { font-size:21px; } .an-summary .stat-l { font-size:10.5px; }

  .cal { margin-top:32px; }
  .cal-wrap { display:flex; gap:9px; }
  .cal-days { display:flex; flex-direction:column; gap:3px; padding-top:19px; flex:none; }
  .cal-day-lbl { height:15px; line-height:15px; font-size:9px; color:var(--soft); }
  .cal-scroll { overflow-x:auto; flex:1; scrollbar-width:none; padding:2px; }
  .cal-scroll::-webkit-scrollbar { display:none; }
  .cal-grid { display:inline-flex; flex-direction:column; }
  .cal-months { display:flex; gap:3px; height:14px; margin-bottom:5px; }
  .cal-month { width:15px; flex:none; font-size:9px; color:var(--muted); white-space:nowrap; overflow:visible; }
  .cal-cols { display:flex; gap:3px; }
  .cal-col { display:flex; flex-direction:column; gap:3px; }
  .cal-cell { width:15px; height:15px; border-radius:4px; flex:none; display:inline-block; box-shadow:inset 0 0 0 1px rgba(255,255,255,.03); transition:transform .1s; }

  .w-hero { text-align:center; margin:16px 0 6px; }
  .w-big { font-family:'Space Grotesk',sans-serif; font-size:clamp(48px,15vw,58px); font-weight:700; letter-spacing:-.03em; line-height:1; }
  .w-big small { font-size:22px; color:var(--muted); font-weight:600; }
  .w-sub { color:var(--muted); font-size:13px; margin-top:9px; }
  .w-goalbar { margin:26px 2px 6px; }
  .w-goalbar .lbls { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:9px; }
  .w-goalbar .lbls b { color:var(--text); font-family:'Space Grotesk',sans-serif; }
  .w-track { position:relative; height:10px; background:rgba(255,255,255,.06); border-radius:99px; box-shadow:inset 0 1px 2px rgba(0,0,0,.3); }
  .w-fill { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg, #2f7fc0, var(--blue)); border-radius:99px; transition:width .8s cubic-bezier(.22,1,.36,1); box-shadow:0 0 12px rgba(90,176,245,.35); }
  .w-input-row { display:flex; gap:10px; margin:24px 0 6px; }
  .w-input-row input { flex:1; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:14px; color:var(--text); font-family:'Space Grotesk',sans-serif; font-size:18px; padding:15px; transition:border-color .15s, box-shadow .15s; }
  .w-input-row input:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(90,176,245,.18); }
  .w-input-row button { position:relative; flex:none; border:1px solid rgba(255,255,255,.18); background:linear-gradient(180deg, #6bbcff, #3f96e6); color:#04121f; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; padding:0 22px; border-radius:14px; cursor:pointer; box-shadow:0 8px 22px rgba(90,176,245,.28), var(--inner-hi); transition:transform .09s, filter .15s; }
  .w-input-row button:active { transform:scale(.97); }

  .hist { margin-top:32px; }
  .day-group { margin-bottom:16px; }
  .day-head { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text); margin-bottom:8px; font-weight:500; }
  .day-badge { font-family:'Space Grotesk',sans-serif; font-size:11.5px; font-weight:600; color:var(--grow); background:rgba(61,220,138,.14); border:1px solid rgba(61,220,138,.2); border-radius:99px; padding:2px 10px; }
  .sess { display:flex; align-items:center; justify-content:space-between; padding:11px 13px; border-radius:13px; margin-bottom:7px; }
  .sess-time { font-size:13px; color:var(--muted); }
  .sess-pct { font-family:'Space Grotesk',sans-serif; font-size:13px; color:var(--grow); }
  .sess-del { background:none; border:none; color:var(--soft); cursor:pointer; font-size:17px; line-height:1; padding:2px 7px; border-radius:8px; transition:color .15s; }
  .sess-del:hover { color:var(--behind); }
  .empty, .w-empty { text-align:center; color:var(--muted); font-size:14px; padding:24px 10px; line-height:1.55; } .empty b { color:var(--text); font-family:'Space Grotesk',sans-serif; }
  .motto { text-align:center; color:var(--soft); font-size:12px; margin-top:40px; line-height:1.5; letter-spacing:.02em; }

  .overlay { position:fixed; inset:0; background:rgba(4,7,11,.55); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  .overlay.open { display:flex; animation:fade .2s ease; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  .sheet { width:100%; max-width:480px; background:linear-gradient(180deg, rgba(24,31,42,.98), rgba(14,19,27,.98)); -webkit-backdrop-filter:blur(24px); backdrop-filter:blur(24px);
    border-top:1px solid var(--line-strong); border-radius:26px 26px 0 0; padding:12px 20px calc(30px + env(safe-area-inset-bottom)); max-height:90vh; overflow-y:auto; box-shadow:0 -24px 70px rgba(0,0,0,.55); animation:rise .28s cubic-bezier(.22,1,.36,1); }
  @keyframes rise { from { transform:translateY(30px); } to { transform:translateY(0); } }
  .sheet::before { content:""; display:block; width:42px; height:4px; border-radius:99px; background:rgba(255,255,255,.22); margin:0 auto 18px; }
  .sheet h2 { font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; margin-bottom:5px; letter-spacing:-.01em; }
  .sheet p.hint { color:var(--muted); font-size:13px; margin-bottom:22px; line-height:1.55; }
  .field { margin-bottom:17px; }
  .field label { display:block; font-size:12.5px; color:var(--muted); margin-bottom:8px; letter-spacing:.01em; }
  .field input { width:100%; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:13px; color:var(--text); font-family:'Inter',sans-serif; font-size:16px; padding:14px; transition:border-color .15s, box-shadow .15s; }
  .field input:focus { outline:none; border-color:var(--grow); box-shadow:0 0 0 3px rgba(61,220,138,.16); }
  .field .note { color:var(--soft); font-size:12px; margin-top:7px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .typerow { display:flex; gap:10px; margin-bottom:22px; }
  .typerow button { flex:1; border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--muted); font-size:14px; font-weight:500; padding:13px; border-radius:13px; cursor:pointer; transition:border-color .15s, color .15s, background .15s; }

function detectLang(){
  try{ const st=localStorage.getItem('mg-lang'); if(st==='fr'||st==='en') return st; }catch(e){}
  const n=(navigator.language||navigator.userLanguage||'fr').toLowerCase();
  return n.startsWith('en')?'en':'fr';
}

const DEF_ACTIONS={ gym:{fr:"J'ai fait ma séance",en:"I did my session"}, read:{fr:"J'ai lu aujourd'hui",en:"I read today"}, generic:{fr:"C'est fait aujourd'hui",en:"Done today"} };
const DEF_ITEMS={ session:{s:{fr:"séance",en:"session"},p:{fr:"séances",en:"sessions"}},

                  time:{s:{fr:"fois",en:"time"},p:{fr:"fois",en:"times"}} };

function tAction(o){ if(o.actionKey&&DEF_ACTIONS[o.actionKey]&&!o.customAction) return DEF_ACTIONS[o.actionKey][LANG]||o.actionLabel; return o.actionLabel; }
function tItemS(o){ if(o.itemKey&&DEF_ITEMS[o.itemKey]) return DEF_ITEMS[o.itemKey].s[LANG]||o.itemS; return o.itemS; }
function tItemP(o){ if(o.itemKey&&DEF_ITEMS[o.itemKey]) return DEF_ITEMS[o.itemKey].p[LANG]||o.itemP; return o.itemP; }

function frNum(n,dec){ const v=Number(n).toFixed(dec); return LANG==='fr'?v.replace('.',','):v; }

const store = {
  async get(k){ try { if (window.storage && window.storage.get) { const r = await window.storage.get(k); return (r && r.value) ? r.value : null; } } catch(e){} try { return localStorage.getItem(k); } catch(e){ return null; } },
  async set(k,v){ let ok=false; try { if (window.storage && window.storage.set) { await window.storage.set(k,v); ok=true; } } catch(e){} try { localStorage.setItem(k,v); ok=true; } catch(e){} return ok; }
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function isoDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function dayKey(ts){ return isoDate(new Date(ts)); }
function sameDay(a,b){ return dayKey(a)===b; }
function mondayOf(d){ const x=new Date(d); x.setHours(0,0,0,0); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
function fr(n,dec){ return frNum(n,dec); }
function MOISg(){ return T('months'); }
function JOURSg(){ return T('days'); }

function freqObj(name,s,e,target,weekly,is,ip,action){ return {id:uid(),type:'frequency',name,startDate:s,endDate:e,target,weeklyTarget:weekly,itemS:is,itemP:ip,actionLabel:action,sessions:[],reached:[]}; }
function weightObj(name,unit){ return {id:uid(),type:'weight',name,unit:unit||'lbs',startWeight:null,goalWeight:null,entries:[]}; }

function defaultObjectives(){
  const t=new Date();
  const e18=new Date(); e18.setMonth(e18.getMonth()+18);
  const e12=new Date(); e12.setFullYear(e12.getFullYear()+1);
  const gym=freqObj('Salle de sport', isoDate(t), '2027-03-06', 116, 5, 'séance','séances', "J'ai fait ma séance");
  gym.weekOverrides={}; gym.key='gym'; gym.actionKey='gym'; gym.itemKey='session';
  const read=freqObj('Lecture', isoDate(t), isoDate(e12), 313, 6, 'lecture','lectures', "J'ai lu aujourd'hui");
  read.key='read'; read.actionKey='read'; read.itemKey='reading';
  const wt=weightObj('Poids','lbs'); wt.key='weight';
  return [gym, read, wt];
}

async function load(){
  let raw=null;
  try { raw = await store.get(STORE_KEY); } catch(e){}
  if (raw) {
    let p=null; try { p=JSON.parse(raw); } catch(e){ p=null; }
    if (p && Array.isArray(p.objectives)) { state=p; }
    else if (p && p.config) { // migrate v1
      const objs=defaultObjectives(); const g=objs[0];
      g.name=p.config.goalName||g.name; g.startDate=p.config.startDate||g.startDate; g.endDate=p.config.endDate||g.endDate;
      g.target=p.config.target||g.target; g.weeklyTarget=p.config.weeklyTarget||g.weeklyTarget;
      g.sessions=Array.isArray(p.sessions)?p.sessions:[]; g.reached=Array.isArray(p.reached)?p.reached:[];
      state={version:2,objectives:objs,activeId:g.id};
    } else { state={version:2,objectives:defaultObjectives(),activeId:null}; }
  } else { state={version:2,objectives:defaultObjectives(),activeId:null}; }
  if (!state.objectives || !state.objectives.length) state.objectives=defaultObjectives();
  state.objectives.forEach(o=>{
    if(o.type==='frequency'){ o.sessions=o.sessions||[]; o.reached=o.reached||[]; if(!o.weeklyTarget) o.weeklyTarget=Math.max(1,Math.round(o.target/26)); o.itemS=o.itemS||'séance'; o.itemP=o.itemP||'séances'; o.actionLabel=o.actionLabel||"J'ai fait ma séance"; }
    else { o.entries=o.entries||[]; o.unit=o.unit||'lbs'; }
    if(!o.key){
      const n=(o.name||'').toLowerCase();
      if(o.type==='weight'&&(n==='poids'||n==='weight')) o.key='weight';
      else if(n==='salle de sport'||n==='gym'){ o.key='gym'; o.actionKey=o.actionKey||'gym'; o.itemKey=o.itemKey||'session'; }
      else if(n==='lecture'||n==='reading'){ o.key='read'; o.actionKey=o.actionKey||'read'; o.itemKey=o.itemKey||'reading'; }
    }
  });
  if (!state.activeId || !state.objectives.find(o=>o.id===state.activeId)) state.activeId=state.objectives[0].id;
  render();
}
async function save(){ await store.set(STORE_KEY, JSON.stringify(state)); }
function active(){ return state.objectives.find(o=>o.id===state.activeId) || state.objectives[0]; }

/* frequency calc */
function freqMetrics(o){
  const target=Math.max(1,Number(o.target)||1);
  const done=o.sessions.length; const perSession=100/target; const pct=done*perSession;
  const s=parseDate(o.startDate).getTime(), e=parseDate(o.endDate).getTime(), now=Date.now();
  const timeFrac=Math.max(0,Math.min(1,(now-s)/(e-s)));
  const daysLeft=Math.max(0,Math.ceil((e-now)/864e5));
  return {target,done,perSession,pct,expectedPct:timeFrac*100,daysLeft,remaining:Math.max(0,target-done)};
}
function wkTargetFor(o,monday){ if(o.weekOverrides){ const k=isoDate(mondayOf(monday)); if(o.weekOverrides[k]!=null) return o.weekOverrides[k]; } return Math.max(1,o.weeklyTarget||1); }
function weekBuckets(o,n){ const out=[]; const m=mondayOf(new Date()); for(let i=n-1;i>=0;i--){ const s=new Date(m); s.setDate(s.getDate()-i*7); const e=new Date(s); e.setDate(e.getDate()+7); const c=o.sessions.filter(x=>{const t=new Date(x.ts);return t>=s&&t<e;}).length; out.push({count:c,label:s.getDate()+'/'+(s.getMonth()+1),mon:new Date(s)});} return out; }
function monthBuckets(o,n){ const out=[]; const b=new Date(); b.setDate(1); b.setHours(0,0,0,0); for(let i=n-1;i>=0;i--){ const s=new Date(b.getFullYear(),b.getMonth()-i,1); const e=new Date(b.getFullYear(),b.getMonth()-i+1,1); const c=o.sessions.filter(x=>{const t=new Date(x.ts);return t>=s&&t<e;}).length; out.push({count:c,label:MOISg()[s.getMonth()].replace('.','')});} return out; }
function curWeek(o){ const s=mondayOf(new Date()); const e=new Date(s); e.setDate(e.getDate()+7); return o.sessions.filter(x=>{const t=new Date(x.ts);return t>=s&&t<e;}).length; }
function weekStreak(o){ const all=weekBuckets(o,80); let st=0; for(let i=all.length-2;i>=0;i--){ if(all[i].count>=wkTargetFor(o,all[i].mon)) st++; else break; } const cur=all[all.length-1]; if(cur.count>=wkTargetFor(o,cur.mon)) st++; return st; }

/* weight calc */
function wMetrics(o){
  const ent=[...o.entries].sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  const cur=ent.length?ent[ent.length-1].value:null;
  const start=(o.startWeight!=null)?o.startWeight:(ent.length?ent[0].value:null);
  const goal=o.goalWeight;
  let progress=null;
  if(cur!=null&&start!=null&&goal!=null&&goal!==start){ progress=Math.max(0,Math.min(100,((cur-start)/(goal-start))*100)); }
  return {ent,cur,start,goal,progress,change:(cur!=null&&start!=null)?cur-start:null};
}

/* actions */
async function logSession(){
  const o=active(); const before=freqMetrics(o).pct;
  const mk=isoDate(mondayOf(new Date())); o.weekOverrides=o.weekOverrides||{}; if(o.weekOverrides[mk]==null) o.weekOverrides[mk]=wkTargetFor(o,mondayOf(new Date()));
  o.sessions.push({id:uid(),ts:new Date().toISOString()});
  await save(); render();
  const m=freqMetrics(o); let hit=null;
  for(const ms of MILESTONES){ if(before<ms&&m.pct>=ms&&!o.reached.includes(ms)){ hit=ms; o.reached.push(ms);} }
  if(hit){ save(); showToast(hit===100?T('tGoalReached'):(hit+' % '+T('tMilestone'))); }
  else { showToast('+'+fr(m.perSession,2)+' %  '+T('tRecorded')); }
  pulseRing();
  pushProgress(); scheduleSync();
}
async function undoLast(){
  const o=active(); const today=isoDate(new Date()); let idx=-1;
  for(let i=o.sessions.length-1;i>=0;i--){ if(sameDay(o.sessions[i].ts,today)){ idx=i; break; } }
  if(idx===-1) idx=o.sessions.length-1;
  if(idx>=0){ o.sessions.splice(idx,1); await save(); render(); pushProgress(); scheduleSync(); }
}
async function setWeekTarget(delta){ const o=active(); if(o.type!=='frequency') return; const monDate=mondayOf(new Date()); const k=isoDate(monDate); o.weekOverrides=o.weekOverrides||{}; const cur=wkTargetFor(o,monDate); o.weekOverrides[k]=Math.max(1,Math.min(14,cur+delta)); await save(); render(); }
async function delSession(id){ const o=active(); o.sessions=o.sessions.filter(s=>s.id!==id); await save(); render(); pushProgress(); scheduleSync(); }
async function logWeight(){
  const o=active(); const el=document.getElementById('w-val'); const v=parseFloat((el.value||'').replace(',','.'));
  if(!isFinite(v)||v<=0){ showToast(T('tValidWeight')); return; }
  o.entries.push({id:uid(),ts:new Date().toISOString(),value:v});
  if(o.startWeight==null) o.startWeight=v;
  await save(); render(); scheduleSync(); showToast(T('tWeightSaved'));
}
async function delWeight(id){ const o=active(); o.entries=o.entries.filter(e=>e.id!==id); await save(); render(); scheduleSync(); }

function subline(o){
  if(o.type==='frequency') return `${o.target} ${tItemP(o)} · ${LANG==='en'?'ends':'fin le'} ${fmtDate(parseDate(o.endDate))}`;

}

function renderFreq(o){

        <circle class="ring-fill" id="ringfill" cx="125" cy="125" r="${R}" fill="none" stroke-width="14" stroke-linecap="round" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" stroke="url(#${m.pct>=100?'grGold':'grGreen'})" filter="url(#ringGlow)"/>
      </svg>

      <div class="pace-bar"><div class="pace-fill" style="width:${Math.min(m.pct,100).toFixed(1)}%; background:${fColor}"></div><div class="pace-marker" style="left:${Math.min(m.expectedPct,100).toFixed(1)}%"></div></div>
    </div>
    <div class="action">
      <button class="log-btn" id="log">${escapeHtml(tAction(o))}</button>
      <div class="today-row"><span class="today-count">${T('today')} : <b>${todayCount}</b> ${todayCount===1?tItemS(o):tItemP(o)}</span><button class="undo" id="undo" ${o.sessions.length===0?'disabled':''}>${T('undo')}</button></div>
    </div>
    <button class="share-btn" id="catchup" style="margin-top:12px">${T('catchUp')}</button>
    <div class="subgoal">
      <div class="subgoal-top"><span class="subgoal-title">${T('thisWeek')}</span><span class="wk-ctrl"><button class="wk-step" id="wk-dec" aria-label="Diminuer l'objectif de la semaine">−</button><span class="subgoal-count num ${wkDone?'done':''}"><b>${cw}</b> / ${wt}</span><button class="wk-step" id="wk-inc" aria-label="Augmenter l'objectif de la semaine">+</button></span></div>

function avgGauge(o){
  const need=o.target/Math.max(1,(parseDate(o.endDate)-parseDate(o.startDate))/6048e5);
  const all=weekBuckets(o,80);
  const startMon=mondayOf(parseDate(o.startDate));
  const past=all.filter(b=>b.mon>=startMon && b.mon<mondayOf(new Date()));
  const recent=past.slice(-8);
  if(recent.length===0){
    return `<div class="avg stat"><div class="avg-top"><span class="avg-title">${T('avgTitle')}</span><span class="avg-val">—</span></div>
      <div class="avg-msg" style="margin-top:8px;color:var(--muted)">${T('avgNone')} <b>${fr(need,1)}</b> ${T('perWeekEnd')}</div></div>`;
  }
  const avg=recent.reduce((a,b)=>a+b.count,0)/recent.length;
  const MAXG=7;
  const pos=Math.min(100,(avg/MAXG)*100), tpos=Math.min(100,(need/MAXG)*100);
  const gap=avg-need;
  let color,msg;
  if(gap>=0.25){ color='var(--gold)'; msg=T('avgAbove'); }
  else if(gap>=-0.25){ color='var(--grow)'; msg=T('avgPerfect'); }
  else if(gap>=-0.75){ color='var(--gold)'; msg=T('avgSlip'); }
  else { color='var(--behind)'; msg=T('avgUnder')+' '+fr(need,1)+'.'; }
  return `<div class="avg stat">
    <div class="avg-top"><span class="avg-title">${T('avgTitle')}</span><span class="avg-val" style="color:${color}">${fr(avg,1)} <span>/ ${fr(need,1)}</span></span></div>
    <div class="avg-gauge"><div class="avg-fill" style="width:${pos.toFixed(1)}%; background:${color}"></div><div class="avg-target" style="left:${tpos.toFixed(1)}%"></div></div>
    <div class="avg-msg" style="color:${color==='var(--grow)'?'var(--muted)':color}">${msg}</div>
    <div class="avg-msg" style="color:var(--soft);margin-top:6px;font-size:11.5px">${T('lastWeeks')} ${recent.length} ${recent.length>1?T('weekPlur'):T('weekSing')}</div>
  </div>`;
}
function freqChart(o){
  const week = view==='week';
  const buckets = week ? weekBuckets(o,10) : monthBuckets(o,6);
  const thisMon = mondayOf(new Date());
  // A tick is drawn only for weeks the user actually set a target for (past or current). Nothing is predicted.
  const targets = week ? buckets.map(b=>{ const k=isoDate(b.mon); const set=(o.weekOverrides&&o.weekOverrides[k]!=null)?o.weekOverrides[k]:null;
    if(set!=null) return set; if(b.mon.getTime()===thisMon.getTime()) return wkTargetFor(o,b.mon); return null; }) : [];
  const W=320,H=150,padT=12,padB=24,plotH=H-padT-padB,n=buckets.length,gap=7,barW=(W-gap*(n+1))/n;
  const maxV=Math.max(1,...targets.filter(x=>x!=null),...buckets.map(b=>b.count));
  let bars='',ticks='';
  buckets.forEach((b,i)=>{ const x=gap+i*(barW+gap); const h=(b.count/maxV)*plotH; const y=padT+plotH-h; const cur=i===n-1; const col=cur?'var(--gold)':'var(--grow)';
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="4" fill="${col}" ${b.count===0?'opacity="0.25"':''}/>`;
    if(b.count>0) bars+=`<text x="${(x+barW/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="11" fill="var(--text)">${b.count}</text>`;
    bars+=`<text x="${(x+barW/2).toFixed(1)}" y="${(H-8).toFixed(1)}" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="var(--muted)">${b.label}</text>`;
    if(week && targets[i]!=null){ const ty=padT+plotH-(targets[i]/maxV)*plotH; ticks+=`<line x1="${(x-1).toFixed(1)}" y1="${ty.toFixed(1)}" x2="${(x+barW+1).toFixed(1)}" y2="${ty.toFixed(1)}" stroke="var(--soft)" stroke-width="1.5" stroke-dasharray="3 3"/>`; }
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${ticks}${bars}</svg>`;
}
function freqSummary(o){
  if(view==='week'){ const w=weekBuckets(o,60).filter(x=>x.count>0); const best=w.reduce((a,b)=>Math.max(a,b.count),0); const avg=w.length?w.reduce((a,b)=>a+b.count,0)/w.length:0;
    return `<div class="an-summary"><div class="stat"><div class="stat-v num">${best}</div><div class="stat-l">${T('bestWeek')}</div></div><div class="stat"><div class="stat-v num">${fr(avg,1)}</div><div class="stat-l">${T('avgWeek')}</div></div><div class="stat"><div class="stat-v num">${w.length}</div><div class="stat-l">${T('activeWeeks')}</div></div></div>`; }
  const mo=monthBuckets(o,24).filter(x=>x.count>0); const best=mo.reduce((a,b)=>Math.max(a,b.count),0); const avg=mo.length?mo.reduce((a,b)=>a+b.count,0)/mo.length:0;
  return `<div class="an-summary"><div class="stat"><div class="stat-v num">${best}</div><div class="stat-l">${T('bestMonth')}</div></div><div class="stat"><div class="stat-v num">${fr(avg,1)}</div><div class="stat-l">${T('avgMonth')}</div></div><div class="stat"><div class="stat-v num">${mo.length}</div><div class="stat-l">${T('activeMonths')}</div></div></div>`;
}
function heatColor(c){ if(c<=0) return 'rgba(255,255,255,0.05)'; if(c===1) return 'rgba(61,220,138,0.32)'; if(c===2) return 'rgba(61,220,138,0.62)'; return '#3ddc8a'; }
function heatmap(o){
  const startReal=parseDate(o.startDate);
  const today=new Date(); today.setHours(0,0,0,0);
  const lastMon=mondayOf(today);
  let start=mondayOf(startReal);
  let weeks=Math.round((lastMon-start)/6048e5)+1; if(weeks<1) weeks=1;
  if(weeks>90){ start=new Date(lastMon); start.setDate(start.getDate()-89*7); weeks=90; }
  const map={}; o.sessions.forEach(s=>{ const k=dayKey(s.ts); map[k]=(map[k]||0)+1; });
  let cols='',months='',prevM=-1;
  for(let w=0;w<weeks;w++){
    const colMon=new Date(start); colMon.setDate(colMon.getDate()+w*7);
    const m=colMon.getMonth(); let ml=''; if(m!==prevM){ ml=MOISg()[m].replace('.',''); prevM=m; }
    months+=`<div class="cal-month">${ml}</div>`;
    let cells='';
    for(let d=0;d<7;d++){ const day=new Date(colMon); day.setDate(day.getDate()+d);
      const inRange=day>=startReal&&day<=today; const c=map[isoDate(day)]||0;
      cells+= inRange ? `<div class="cal-cell" title="${isoDate(day)} : ${c}" style="background:${heatColor(c)}"></div>` : `<div class="cal-cell" style="visibility:hidden"></div>`;
    }
    cols+=`<div class="cal-col">${cells}</div>`;
  }
  const lbls=T('dayInit').map(x=>`<div class="cal-day-lbl">${x}</div>`).join('');
  return `<div class="cal-wrap"><div class="cal-days">${lbls}</div><div class="cal-scroll" id="cal-scroll"><div class="cal-grid"><div class="cal-months">${months}</div><div class="cal-cols">${cols}</div></div></div></div>
    <div class="chart-legend" style="justify-content:flex-end;gap:4px;margin-top:12px">${T('less')} <span class="cal-cell" style="background:rgba(255,255,255,0.05)"></span><span class="cal-cell" style="background:rgba(61,220,138,0.32)"></span><span class="cal-cell" style="background:rgba(61,220,138,0.62)"></span><span class="cal-cell" style="background:#3ddc8a"></span> ${T('more')}</div>`;
}
function freqHistory(o){
  if(o.sessions.length===0) return `<div class="empty">${T('noneYet')} ${tItemS(o)} ${T('forNow')}<br>${T('firstWorth')} <b>${fr(100/Math.max(1,o.target),2)} %</b>.</div>`;
  const g={}; for(const s of o.sessions){ const k=dayKey(s.ts); (g[k]=g[k]||[]).push(s); }
  const keys=Object.keys(g).sort().reverse().slice(0,90); const per=100/Math.max(1,o.target); let html='';
  for(const k of keys){ const list=g[k].sort((a,b)=>new Date(b.ts)-new Date(a.ts)); const d=parseDate(k);
    html+=`<div class="day-group"><div class="day-head">${fmtDayHead(d)} <span class="day-badge">+${fr(per*list.length,2)} %</span></div>`;
    for(const s of list){ const t=new Date(s.ts); const hh=String(t.getHours()).padStart(2,'0'),mm=String(t.getMinutes()).padStart(2,'0');
      html+=`<div class="sess"><span class="sess-time">${hh}:${mm}</span><span style="display:flex;align-items:center;gap:12px"><span class="sess-pct num">+${fr(per,2)} %</span><button class="sess-del" data-del="${s.id}" aria-label="Supprimer">×</button></span></div>`; }
    html+=`</div>`; }
  return html;
}

function weightChart(o){
  const ent=[...o.entries].sort((a,b)=>new Date(a.ts)-new Date(b.ts)).slice(-30);
  const W=320,H=150,padT=14,padB=22,padL=6,padR=6,plotH=H-padT-padB,plotW=W-padL-padR;
  if(ent.length===0) return `<svg viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="var(--muted)">${LANG==='en'?'Add your weight to see the curve':'Ajoute ton poids pour voir la courbe'}</text></svg>`;
  const vals=ent.map(e=>e.value); let mn=Math.min(...vals), mx=Math.max(...vals);
  if(o.goalWeight!=null){ mn=Math.min(mn,o.goalWeight); mx=Math.max(mx,o.goalWeight); }
  if(mn===mx){ mn-=1; mx+=1; } const pad=(mx-mn)*0.15; mn-=pad; mx+=pad;
  const X=i=> ent.length===1 ? padL+plotW/2 : padL+(i/(ent.length-1))*plotW;
  const Y=v=> padT+plotH-((v-mn)/(mx-mn))*plotH;
  let pts=ent.map((e,i)=>`${X(i).toFixed(1)},${Y(e.value).toFixed(1)}`).join(' ');
  let area=`${padL},${padT+plotH} `+pts+` ${(padL+plotW).toFixed(1)},${padT+plotH}`;
  let dots=ent.map((e,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(e.value).toFixed(1)}" r="3" fill="var(--blue)"/>`).join('');
  let goalLine=''; if(o.goalWeight!=null){ const y=Y(o.goalWeight); goalLine=`<line x1="0" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="4 4"/>`; }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><polygon points="${area}" fill="rgba(74,168,242,0.12)"/>${goalLine}<polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}
function weightSummary(o,m){
  const goalTxt = (m.cur!=null&&m.goal!=null) ? fr(m.cur-m.goal,1)+' '+o.unit : '—';
  return `<div class="an-summary"><div class="stat"><div class="stat-v num">${m.cur!=null?fr(m.cur,1):'—'}</div><div class="stat-l">${T('current')}</div></div><div class="stat"><div class="stat-v num">${m.goal!=null?fr(m.goal,1):'—'}</div><div class="stat-l">${T('goal')}</div></div><div class="stat"><div class="stat-v num">${goalTxt}</div><div class="stat-l">${T('toGo')}</div></div></div>`;
}
function weightHistory(o){
  if(o.entries.length===0) return `<div class="empty">${T('noWeightHist')}<br>${T('enterFirst')}</div>`;
  const ent=[...o.entries].sort((a,b)=>new Date(b.ts)-new Date(a.ts)).slice(0,120); let html='';
  ent.forEach((e,i)=>{ const t=new Date(e.ts); const next=ent[i+1]; let delta=''; if(next){ const d=e.value-next.value; if(Math.abs(d)>=0.05) delta=`<span class="sess-pct num" style="color:${d>0?'var(--behind)':'var(--grow)'}">${d>0?'+':''}${fr(d,1)}</span>`; }
    html+=`<div class="sess"><span class="sess-time">${fmtDayHead(t)} · ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}</span><span style="display:flex;align-items:center;gap:12px"><span class="num" style="font-size:14px">${fr(e.value,1)} ${o.unit}</span>${delta}<button class="sess-del" data-delw="${e.id}" aria-label="Supprimer">×</button></span></div>`; });
  return html;
}

const CATCHUP_DAYS=8;
let catchupTarget=null;
function missedDays(o){
  const out=[]; const today=new Date(); today.setHours(0,0,0,0);
  const start=parseDate(o.startDate);
  const counts={}; o.sessions.forEach(x=>{ const k=dayKey(x.ts); counts[k]=(counts[k]||0)+1; });
  for(let i=1;i<=CATCHUP_DAYS;i++){
    const d=new Date(today); d.setDate(d.getDate()-i);
    if(d<start) break;
    out.push({ date:new Date(d), key:isoDate(d), count:counts[isoDate(d)]||0 });
  }
  return out;
}

/* ---- Images : compression, upload, suppression ---- */
const MEDIA='media';
function publicUrl(path){ if(!path||!sb) return null; try{ const {data}=sb.storage.from(MEDIA).getPublicUrl(path); return data?data.publicUrl:null; }catch(e){ return null; } }
function compressImage(file,maxW,quality){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{ const im=new Image();
      im.onload=()=>{ let w=im.width,h=im.height; if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(im,0,0,w,h);
        c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',quality); };
      im.onerror=()=>rej(new Error('img')); im.src=r.result; };
    r.onerror=()=>rej(new Error('read')); r.readAsDataURL(file);
  });
}
function pickImage(){
  return new Promise(res=>{
    const i=document.createElement('input'); i.type='file'; i.accept='image/*';
    i.onchange=()=>res(i.files&&i.files[0]?i.files[0]:null); i.click();
  });
}
async function uploadImage(blob,prefix){
  const path=prefix+'/'+me.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg';
  const {error}=await sb.storage.from(MEDIA).upload(path,blob,{contentType:'image/jpeg',upsert:false});
  if(error) throw error;
  return path;
}
async function uploadRaw(file,prefix,ext,ctype){
  const path=prefix+'/'+me.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext;
  const {error}=await sb.storage.from(MEDIA).upload(path,file,{contentType:ctype,upsert:false});
  if(error) throw error;
  return path;
}
async function removeImage(path){ if(!path) return; try{ await sb.storage.from(MEDIA).remove([path]); }catch(e){} }

function seenLabel(iso){
  if(!iso) return '';
  const diff=Math.floor((Date.now()-new Date(iso).getTime())/60000);
  if(diff<2) return T('online');
  if(diff<60) return T('lastSeen')+' '+T('minAgo').replace('%d',diff);
  const h=Math.floor(diff/60); if(h<24) return T('lastSeen')+' '+T('hAgo').replace('%d',h);

function openViewer(url,who,isVid){
  const v=document.getElementById('viewer'); if(!v) return;
  const img=v.querySelector('#v-img'); const vid=v.querySelector('#v-vid');
  v.querySelector('#v-who').textContent=who||'';
  const bar=v.querySelector('#v-bar'); bar.style.width='0%';
  clearInterval(window.__vT); let paused=false;
  if(isVid){
    img.style.display='none'; vid.style.display='block'; vid.src=url; vid.currentTime=0; vid.play().catch(()=>{});
    vid.onended=()=>closeViewer();
    vid.ontimeupdate=()=>{ if(vid.duration) bar.style.width=Math.min(100,(vid.currentTime/vid.duration)*100)+'%'; };
    v.onpointerdown=()=>{ vid.pause(); };
    v.onpointerup=()=>{ if(v.classList.contains('open')) vid.play().catch(()=>{}); };
    v.onpointercancel=()=>{ if(v.classList.contains('open')) vid.play().catch(()=>{}); };
  } else {
    vid.style.display='none'; vid.pause&&vid.pause(); vid.src=''; img.style.display='block'; img.src=url;
    let p=0; const step=()=>{ if(paused) return; p+=2; bar.style.width=Math.min(100,p)+'%'; if(p>=100){ clearInterval(window.__vT); closeViewer(); } };
    window.__vT=setInterval(step,100);
    v.onpointerdown=()=>{ paused=true; };
    v.onpointerup=()=>{ paused=false; };
    v.onpointercancel=()=>{ paused=false; };
  }
  v.classList.add('open');
}
function closeViewer(){ const v=document.getElementById('viewer'); if(!v) return; clearInterval(window.__vT); v.classList.remove('open'); const im=v.querySelector('#v-img'); if(im) im.src=''; const vd=v.querySelector('#v-vid'); if(vd){ vd.pause(); vd.src=''; } }

async function postStatus(){
  const el=document.getElementById('st-input'); if(!el) return;
  const body=(el.value||'').trim();
  if(!body && !stMedia) return;

  try{
    const start=new Date(); start.setHours(0,0,0,0);
    const {data:mine}=await sb.from('statuses').select('media').eq('group_id',myGroup.id).eq('author_id',me.id).gte('created_at',start.toISOString());
    const rows=mine||[];
    const nText=rows.filter(r=>!r.media).length;

    const nVideo=rows.filter(r=>r.media==='video').length;
    if(stMediaType==='photo' && nPhoto>=4){ showToast(T('limPhoto')); return; }

  }catch(e){}
  try{

      showToast(T('uploading'));
      if(stMediaType==='video'){ path=await uploadRaw(stMedia,'status','mp4',stMedia.type||'video/mp4'); media='video'; }
      else { const blob=await compressImage(stMedia,1080,0.78); path=await uploadImage(blob,'status'); media='photo'; }
    }

async function pickStatusVideo(){

  on('am-signup',()=>{ authMode='signup'; render(); });
  on('a-go',doAuth);
  on('a-forgot',forgotPassword);
  const eye=document.getElementById('pw-eye');
  if(eye) eye.onclick=()=>{ const p=document.getElementById('a-pass'); if(!p) return;
    const show = p.type==='password'; p.type = show?'text':'password';
    eye.innerHTML = eyeSvg(show); eye.setAttribute('aria-label', show?'Masquer le mot de passe':'Afficher le mot de passe'); p.focus(); };
  on('a-out',doLogout);
  on('g-create',createGroup);
  on('g-join',joinGroup);
  on('g-refresh',refreshGroup);
  on('ps-save',savePseudo);
  on('st-post',postStatus);
  on('sk-session',()=>{ stKind='session'; render(); });
  on('sk-quote',()=>{ stKind='quote'; render(); });
  const si=document.getElementById('st-input'); if(si) si.onkeydown=(e)=>{ if(e.key==='Enter') postStatus(); };
  document.querySelectorAll('[data-stdel]').forEach(b=>{ b.onclick=()=>delStatus(b.dataset.stdel); });
  on('st-pick',pickStatusPhoto);
  on('st-pickv',pickStatusVideo);
  on('st-clear',clearStatusPhoto);
  on('av-change',changeAvatar);
  on('av-del',deleteAvatar);
  document.querySelectorAll('[data-view]').forEach(b=>{ b.onclick=()=>openViewer(b.dataset.view,b.dataset.who, b.dataset.vid==='1'); });
  on('md-back',()=>{ openMateDetail=null; render(); });
  document.querySelectorAll('[data-detail]').forEach(b=>{ b.onclick=()=>{ openMateDetail=b.dataset.detail; render(); }; });
  const pi=document.getElementById('ps-input'); if(pi) pi.onkeydown=(e)=>{ if(e.key==='Enter') savePseudo(); };
  on('g-copy',()=>{ if(navigator.clipboard) navigator.clipboard.writeText(myGroup.code).then(()=>showToast(T('tCodeCopied'))).catch(()=>{}); });
  const pass=document.getElementById('a-pass'); if(pass) pass.onkeydown=(e)=>{ if(e.key==='Enter') doAuth(); };
  const gc=document.getElementById('g-code'); if(gc) gc.onkeydown=(e)=>{ if(e.key==='Enter') joinGroup(); };
  document.querySelectorAll('[data-cmt]').forEach(b=>{ b.onclick=()=>{ openMate = (openMate===b.dataset.cmt)?null:b.dataset.cmt; render(); }; });
  document.querySelectorAll('[data-enc]').forEach(b=>{ b.onclick=async()=>{
    const msgs=T('encMsgs');
    const m=msgs[Math.floor(Math.random()*msgs.length)];
    try{ await sb.from('comments').insert({group_id:myGroup.id,author_id:me.id,target_id:b.dataset.enc,body:m}); showToast('Encouragement envoyé'); await loadGroup(); render(); }catch(e){ showToast(T('tSendFail')); }
  }; });
  const send=document.getElementById('cmt-send'); if(send) send.onclick=()=>sendComment(openMate);
  const ci=document.getElementById('cmt-input'); if(ci) ci.onkeydown=(e)=>{ if(e.key==='Enter') sendComment(openMate); };
}

function formatPct(p){ if(p===0) return '0'; if(p>=100) return p.toFixed(0); return fr(p,1); }
function fmtDate(d){ return d.getDate()+' '+MOISg()[d.getMonth()]+' '+d.getFullYear(); }
function fmtDayHead(d){ const today=new Date(); today.setHours(0,0,0,0); const y=new Date(today); y.setDate(y.getDate()-1); const dd=new Date(d); dd.setHours(0,0,0,0);
  if(dd.getTime()===today.getTime()) return T('today'); if(dd.getTime()===y.getTime()) return T('yesterday');
  return cap(JOURSg()[d.getDay()])+' '+d.getDate()+' '+MOISg()[d.getMonth()]; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function escapeHtml(s){ const p=document.createElement('div'); p.textContent=s==null?'':String(s); return p.innerHTML; }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }
let toastTimer;
function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1900); }
function pulseRing(){ const r=document.getElementById('ringfill'); if(r) r.animate([{opacity:.4},{opacity:1}],{duration:500,easing:'ease-out'}); }

document.documentElement.lang = LANG;
applyTheme();
document.getElementById('overlay').addEventListener('click',(e)=>{ if(e.target.id==='overlay') closeSheet(); });
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape'){ closeSheet(); closeViewer(); } });
(function(){ const c=document.getElementById('v-close'); if(c) c.onclick=(e)=>{ e.stopPropagation(); closeViewer(); }; })();
setInterval(()=>{ if(me&&myProfile) touchSeen(); }, 120000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&me&&myProfile) touchSeen(); });
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
load();
cloudBoot();
checkUpdate();
setInterval(checkUpdate, 60*60*1000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkUpdate(); });
</script>
